[package]
name = "yegz"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.37"
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
egui_commonmark = "0.26"
egui_extras = { version = "0.37", features = ["file", "image", "svg", "syntect"] }
hayro = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
regex = "1.11"
resvg = { version = "0.45", default-features = false }
rfd = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
usvg = { version = "0.45", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
